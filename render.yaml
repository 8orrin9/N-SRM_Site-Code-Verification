services:
  - type: web
    name: n-srm-site-verification
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MAPS_ADAPTER_MODE
        value: real
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: JUSO_CONFM_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
