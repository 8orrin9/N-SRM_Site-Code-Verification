# ISO 3166-1 alpha-2 국가코드 → 현지어 검색 languageCode(BCP-47).
#
# 용도: Google Places TextSearch가 영어 이름으로 업체를 못 찾을 때(displayName이
# 영어로 와서 현지어 업체명과 SIM 매칭 실패), 해당 국가의 현지어로 1회 재검색해
# 현지어 displayName과 다시 비교하기 위한 매핑이다.
#
# 규칙:
#   - 입력 데이터의 "국가/지역" 컬럼은 "CN:중국" 형식이며, 콜론 앞 코드로 조회한다.
#   - 여기 없는 국가코드는 현지어 재검색을 생략한다(영어 결과만 사용).
#   - 영어권(en)은 재검색이 무의미하므로 등재하지 않는다(예: US, GB).
#   - 다국어권(예: SG)은 오매칭 위험이 있어 등재하지 않는다.
#
# 국가 추가는 이 파일에만 하면 된다(코드 수정 불필요).

CN: zh      # 중국
KR: ko      # 한국
VN: vi      # 베트남
TH: th      # 태국
MY: ms      # 말레이시아
MX: es      # 멕시코
JP: ja      # 일본
TW: zh-TW   # 대만
HK: zh-HK   # 홍콩
